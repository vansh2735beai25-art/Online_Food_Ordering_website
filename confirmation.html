<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation | CheesY MomentS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a class="logo" href="project.html#home">CheesY MomentS</a>
        <nav>
            <ul>
                <li><a href="project.html#home">Home</a></li>
                <li><a href="project.html#menu">Menu</a></li>
                <li><a href="project.html#about">About</a></li>
                <li><a href="project.html#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="confirmation">
        <section class="confirmation-box">
            <p class="eyebrow">Order placed</p>
            <h1>Thank you for your order!</h1>
            <p>Your food is being prepared and will arrive soon.</p>

            <div class="order-summary" data-summary>
                <p>No order details found. Please choose an item from the menu.</p>
            </div>

            <div class="tracking">
                <p>Status: <strong data-status>Preparing your order</strong></p>
                <button class="btn" type="button" data-track>Track My Order</button>
                <a class="btn btn-secondary" href="project.html#menu">Order More</a>
            </div>
        </section>
    </main>

    <footer>
        <p>(c) 2026 CheesY MomentS | All Rights Reserved</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
